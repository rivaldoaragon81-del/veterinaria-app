<h2>Historial Clínico</h2>

<table border="1">

  <tr>
    <th>Mascota</th>
    <th>Veterinario</th>
    <th>Diagnóstico</th>
    <th>Tratamiento</th>
    <th>Observaciones</th>
  </tr>

  <tr *ngFor="let item of historial">
    <td>{{ item.mascota }}</td>
    <td>{{ item.veterinario }}</td>
    <td>{{ item.diagnostico }}</td>
    <td>{{ item.tratamiento }}</td>
    <td>{{ item.observaciones }}</td>
  </tr>

</table>
